<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Tickets</title>
    <script>
      // Aplica el tema guardado (o el del sistema) antes del primer pintado, sin parpadeo.
      // Usa la misma clave que src/shared/theme/theme.store.ts.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('ticket-theme') || '{}');
          var preference = (saved.state && saved.state.preference) || 'system';
          var dark =
            preference === 'dark' ||
            (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          // Sin almacenamiento disponible: se queda el tema del sistema que aplica la app
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
